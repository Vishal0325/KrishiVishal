# Project-wide Gradle settings.
# AGP 9.0+ Optimized Configuration

# Performance & Memory Settings
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=1024m -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configurationcache=false
android.sdk.elide_vfs=true

# Kotlin settings
kotlin.daemon.jvmargs=-Xmx2048m
kotlin.compiler.execution.strategy=in-process

# Kotlin Code Style
kotlin.code.style=official

# Android Gradle Plugin Settings
android.useAndroidX=true
android.enableJetifier=false

# Optimize R class generation
android.nonTransitiveRClass=true
android.nonFinalResIds=true
