# Project-wide Gradle settings.
# AGP 9.0+ Optimized Configuration

# Performance & Memory Settings
# Increase memory to 4GB to prevent freezing during configuration
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=false

# Kotlin Daemon Settings
# Increased to 4GB to support memory-heavy KSP processing on newer JDKs
kotlin.daemon.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

# Kotlin Code Style
kotlin.code.style=official

# Android Gradle Plugin Settings (AGP 8.7+ Standard)
android.useAndroidX=true
android.enableJetifier=false

# Optimize R class generation
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Enabled parallel sync
org.gradle.tooling.parallel=true

