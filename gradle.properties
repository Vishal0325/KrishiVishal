# Project-wide Gradle settings.
# AGP 9.0+ Optimized Configuration

# Performance & Memory Settings
# Increase memory to 4GB to prevent freezing during configuration
org.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configurationcache=true

# Kotlin Code Style
kotlin.code.style=official

# Android Gradle Plugin Settings (AGP 9.0 Standard)
android.useAndroidX=true
android.enableJetifier=false

# Optimize R class generation (Default in modern AGP)
android.nonTransitiveRClass=true
android.nonFinalResIds=true

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
